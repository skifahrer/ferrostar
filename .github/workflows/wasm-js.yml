name: WASM (JS)
on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Code or docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="" ;;
            push) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files="" ;;
            *) files="" ;;
          esac
          # an unknown change counts as code; compare lists at most 300 files
          if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] && ! grep -qvE '\.md$' <<< "$files"; then
            echo "::notice::only docs changed, so no tests run"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-wasm-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: npm ci
        run: npm ci
        working-directory: web

      - name: Format + lint check
        run: just format-web --check

      - name: Build web library
        run: just build-web

      - name: Web unit tests
        run: npm test -- --run
        working-directory: web

      - name: Build site
        run: npm run build:site
        working-directory: web

      - name: WASM unit tests
        run: wasm-pack test --firefox --headless ferrostar --no-default-features --features wasm_js
        working-directory: common
