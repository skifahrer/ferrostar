name: Rust (Common)
on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Code or docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="" ;;
            push) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files="" ;;
            *) files="" ;;
          esac
          # an unknown change counts as code; compare lists at most 300 files
          if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] && ! grep -qvE '\.md$' <<< "$files"; then
            echo "::notice::only docs changed, so no tests run"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust-msrv
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - run: just check-msrv

  semver-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust-semver
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: common/Cargo.toml
          feature-group: default-features

  rustfmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust-rustfmt
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: rustfmt checks
        run: just format-common --check

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - name: Cargo Build
        run: just build-common --verbose
      - name: Run tests (nextest + doctests)
        run: just test-common
